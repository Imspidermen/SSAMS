<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta
      name="description"
      content="Smart Student Attendance Management System - secure, verifiable attendance for colleges and universities."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Smart Attendance | SSAMS</title>
    <script>
      // Applied before first paint so dark mode never flashes a light frame.
      (function () {
        try {
          var stored = localStorage.getItem('ssams.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme =
            stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
